# nginx de Residuos SMT. Va en /etc/nginx/sites-available/ambiente.
#
# Se usa en dos tiempos (paso 5 del README):
#   1. Así como está, sólo el bloque de 80, y se corre certbot.
#   2. Certbot escribe el bloque 443. Adentro de ese bloque se pegan las líneas
#      de abajo marcadas «PARA EL BLOQUE 443».
#
# Sin default_server: en nginx 1.24 esa marca es del puerto entero y le
# cambiaría el destino a los sitios de los demás proyectos.

server {
    listen 80;
    listen [::]:80;
    server_name ambiente.195-35-42-168.sslip.io;

    access_log /var/log/nginx/ambiente.access.log;
    error_log  /var/log/nginx/ambiente.error.log;

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}

