# Residuos SMT — github.com/DIA-SMT/AppAmbiente
# Next.js en 127.0.0.1:3018 (pm2-ambiente), versiones en /srv/ambiente.
# La base sigue en Supabase. Va en /etc/nginx/sites-available/ambiente.
#
# El certificado se saca con certbot certonly --webroot (ver README, paso 5):
# certbot no toca este archivo. Sin default_server: en nginx 1.24 esa marca es
# del puerto entero y le cambiaría el destino a los sitios de los demás.

server {
    listen 80;
    listen [::]:80;
    server_name ambiente.195-35-42-168.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24: http2 va en la línea listen; "http2 on;" no compila.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ambiente.195-35-42-168.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/ambiente.195-35-42-168.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambiente.195-35-42-168.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ambiente.access.log;
    error_log  /var/log/nginx/ambiente.error.log warn;

    # Las fotos de las altas y los Excel que se importan: la app acepta hasta
    # 8 MB por pedido (next.config.ts).
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Los estáticos compilados de Next llevan hash en el nombre: los sirve
    # nginx sin pasar por Node.
    location /_next/static/ {
        alias /srv/ambiente/actual/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Migue tarda en contestar mientras arma la respuesta.
        proxy_read_timeout 120s;
    }
}
